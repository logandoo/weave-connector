[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-connector"
version = "0.1.0"
description = "MCP server giving agents persistent interactive SSH shell sessions"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12,<2",
    "asyncssh>=2.14",
    "keyring>=24",
]

[tool.setuptools.packages.find]
where = ["src"]
